plugins {
    id 'java'
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev.legacyforge' version '2.0.142'
    id 'com.gto.gtopublishgradleplugin' version '1.0.27'
}

version = gto_version
group = maven_group
base {
    archivesName = archives_base_name
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)
java.withSourcesJar()

legacyForge {
    enable {
        forgeVersion = "${minecraft_version}-${forge_version}"
    }
    accessTransformers = [file('src/main/resources/META-INF/accesstransformer.cfg')]

    runs {
        client {
            client()
        }
        server {
            server()
        }
        configureEach {
            gameDirectory = file('run')
            systemProperty('forge.logging.console.level', 'info')
            systemProperty('fml.earlyprogresswindow', 'false')
        }
    }

    mods {
        emi {
            sourceSet sourceSets.main
        }
    }

    addModdingDependenciesTo(sourceSets.test)
}

mixin {
    add sourceSets.main, "emi.refmap.json"
    config "emi.mixins.json"
    config "emitrades.mixins.json"
}

repositories {
    maven {
        name = 'GTOdyssey'
        url = 'https://gtodyssey.com/maven/releases'
        content {
            includeGroup 'com.gto.fastcollection'
        }
    }
    maven {
        name = 'ModMaven'
        url = 'https://modmaven.dev/'
        content {
            includeGroup 'mezz.jei'
        }
    }
    maven {
        name = 'Sponge / Mixin'
        url = 'https://repo.spongepowered.org/repository/maven-public/'
    }
    mavenCentral()
}

dependencies {
    compileOnly 'org.jetbrains:annotations:24.1.0'
    testCompileOnly 'org.jetbrains:annotations:24.1.0'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // 运行时由整合包里的 LeanObject 提供
    implementation "com.gto.fastcollection:FastCollection:${fastcollection_version}"

    modCompileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    modCompileOnly "mezz.jei:jei-${minecraft_version}-forge:${jei_version}"
    modRuntimeOnly "mezz.jei:jei-${minecraft_version}-forge:${jei_version}"

    testImplementation(platform("org.junit:junit-bom:${junit_version}"))
    testImplementation 'org.junit.jupiter:junit-jupiter-api'
    testImplementation 'org.junit.jupiter:junit-jupiter-params'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.3.1'
}

sourceSets.test.compileClasspath += sourceSets.main.compileClasspath

test {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    options.compilerArgs.addAll(['-Xmaxerrs', '100000', '-Xlint:-deprecation', '-Xlint:-removal'])
}

tasks.withType(GenerateModuleMetadata).configureEach {
    enabled = false
}

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') {
        expand 'version': project.version
    }
}

jar {
    from('LICENSE') {
        rename { 'LICENSE-EMI' }
    }
    from('NOTICE')
    manifest {
        attributes([
                'Specification-Title'     : 'EMI',
                'Specification-Vendor'    : 'Emi',
                'Specification-Version'   : '1',
                'Implementation-Title'    : 'EMI GTO Edition',
                'Implementation-Version'  : "${version}",
                'Implementation-Vendor'   : 'GregTech Odyssey',
                'MixinConfigs'            : 'emi.mixins.json,emitrades.mixins.json'
        ])
    }
    finalizedBy 'reobfJar'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId project.group
            artifactId base.archivesName.get()
            version project.version
            artifact reobfJar
            artifact sourcesJar
        }
    }
    repositories {
        maven {
            name = 'gtodysseyRepository'
            url = 'https://gtodyssey.com/maven/releases'
            credentials {
                username = findProperty('gtodysseyRepositoryUsername') ?: ''
                password = findProperty('gtodysseyRepositoryPassword') ?: ''
            }
        }
    }
}

tasks.named('publishMavenJavaPublicationToMavenLocal') { dependsOn 'reobfJar' }
tasks.named('publishMavenJavaPublicationToGtodysseyRepositoryRepository') { dependsOn 'reobfJar' }

gtoPublish {
    publishMaven      = true
    publishGithub     = false
    publishCurseforge = true
    curseforgeProjectId = '1760584'
    mavenRepoName     = 'gtodysseyRepository'
    mavenRepoUrl      = 'releases'
    minecraftVersion  = '1.20.1'
    modLoader         = 'Forge'
    curseforgeJavaVersion = 'Java 21'
    curseforgeEnvironment = 'both'
    curseforgeRelations = ['lean-object': 'required', emi: 'incompatible',
                           'emi-trades-villager-trading-emi-plugin': 'incompatible', jei: 'optional']
}
