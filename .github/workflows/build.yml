name: Build
on: [ pull_request, push ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-forge-gradle-${{ hashFiles('**/*.gradle', '**/gradle.properties', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle


      - name: Build Forge
        run: ./gradlew --no-daemon build

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4.4.0
        with:
          name: Artifacts
          path: |
            build/libs/
